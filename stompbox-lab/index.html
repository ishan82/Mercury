<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stompbox Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#121419; --panel:#1a1d24; --panel2:#222630; --line:#2e333e; --text:#e7e9ee; --muted:#98a1ad;
  --accent:#ff8a1f; --accent-ink:#1a1206; --accent2:#3ec7ff; --wire:#c9d2dc; --comp:#eef1f5; --grid:#232731;
  --ok:#52d17c; --err:#ff5d5d; --warn:#ffcc4d; --plotbg:#14171d; --plotgrid:#262b35; --volt:#ffd166;
  --t1:#3ec7ff; --t2:#ff8a1f; --t3:#52d17c; --t4:#e66cff; --t5:#ffd166; --t6:#ff5d8f;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f4f6f9; --line:#d7dbe2; --text:#1b1f27; --muted:#5d6672;
  --accent:#e2680a; --accent-ink:#fff; --accent2:#0a84c6; --wire:#2a313b; --comp:#11151b; --grid:#e3e6eb;
  --plotbg:#ffffff; --plotgrid:#e6e9ee; --volt:#a86400;
  --t1:#0a84c6; --t2:#e2680a; --t3:#1f9d4c; --t4:#a43bc4; --t5:#b08300; --t6:#d6336c; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f4f6f9; --line:#d7dbe2; --text:#1b1f27; --muted:#5d6672;
  --accent:#e2680a; --accent-ink:#fff; --accent2:#0a84c6; --wire:#2a313b; --comp:#11151b; --grid:#e3e6eb;
  --plotbg:#ffffff; --plotgrid:#e6e9ee; --volt:#a86400;
  --t1:#0a84c6; --t2:#e2680a; --t3:#1f9d4c; --t4:#a43bc4; --t5:#b08300; --t6:#d6336c; color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto 1fr var(--bottomH,330px) 24px;grid-template-columns:minmax(0,1fr);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
[hidden]{display:none!important}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#modal .mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(720px,100%);height:min(560px,100%);display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0;font-size:15px} #modal p{margin:0;color:var(--muted);font-size:12px}
#modal textarea{flex:1;min-height:0}
#modal .btns{display:flex;gap:8px;flex-wrap:wrap}
#asideClose{display:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
label.chk{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer}
/* header */
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;margin-right:6px}
.brand svg{width:26px;height:26px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
#title{width:200px;font-weight:600}
.dd{position:relative}
.ddm{display:none;position:absolute;top:100%;left:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:220px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.dd.open .ddm{display:block}
.ddm button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px}
.ddm button:hover{background:var(--panel2)}
/* main */
main{display:grid;grid-template-columns:64px minmax(0,1fr) 290px;min-height:0;min-width:0}
header,#bottom,footer{min-width:0}
#palette{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:4px}
.pal{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;padding:4px 0;border-radius:6px;border:1px solid transparent;background:none;color:var(--comp)}
.pal svg{width:40px;height:30px}
.pal span{font-size:9.5px;color:var(--muted);line-height:1.1}
.pal kbd{font-size:9px;color:var(--muted);opacity:.8}
.pal.on{border-color:var(--accent);background:var(--panel2)}
#canvasWrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#canvasWrap.drop{outline:2px dashed var(--accent);outline-offset:-6px}
#sch{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#sch .sym{fill:none;stroke:var(--comp);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sch .sym .fill{fill:var(--comp)}
#sch .wire{stroke:var(--wire);stroke-width:2;stroke-linecap:round}
#sch .whit{stroke:transparent;stroke-width:12;cursor:pointer}
#sch .comp{cursor:move}
#sch .comp .hit{fill:transparent;stroke:none}
#sch .sel .sym{stroke:var(--accent)}
#sch .sel .sym .fill{fill:var(--accent)}
#sch .wsel{stroke:var(--accent)}
#sch text{font:11px system-ui,sans-serif;fill:var(--muted);stroke:none}
#sch text.ref{fill:var(--text);font-weight:600}
#sch .pin{fill:transparent;stroke:none;cursor:crosshair}
#sch .pin:hover,#sch.wiring .pin{fill:var(--accent2);fill-opacity:.35}
#sch .pindot{fill:var(--accent2);opacity:0}
#sch.wiring .pindot{opacity:.8}
#sch .jdot{fill:var(--wire)}
#sch .ghost{opacity:.5;pointer-events:none}
#sch .selbox{fill:var(--accent2);fill-opacity:.08;stroke:var(--accent2);stroke-dasharray:4 3;pointer-events:none}
#sch text.net{fill:var(--accent2);font-weight:700}
#sch .preview{stroke:var(--accent2);stroke-width:2;stroke-dasharray:5 4;fill:none;pointer-events:none}
#sch .vlbl{font:600 10.5px ui-monospace,Menlo,monospace;fill:var(--volt)}
#sch .vbg{fill:var(--bg);opacity:.75}
#sch .cursor{fill:var(--accent2);opacity:.6;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font:12px ui-monospace,Menlo,monospace;display:none;white-space:nowrap;z-index:5}
#modeBadge{position:absolute;left:10px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted);font-size:12px;pointer-events:none}
#zoomBtns{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
/* side */
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.panel{padding:10px 12px;border-bottom:1px solid var(--line)}
.panel h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
#knobs{display:flex;flex-wrap:wrap;gap:8px}
.knob{display:flex;flex-direction:column;align-items:center;width:76px;user-select:none}
.knob svg{width:56px;height:56px;cursor:ns-resize;touch-action:none}
.knob .kl{font-weight:600;font-size:12px;text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knob .kv{font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.swbtn{width:56px;height:56px;border-radius:50%;font-weight:700;font-size:15px}
.knob svg:focus-visible{outline:2px solid var(--accent);border-radius:50%}
.empty{color:var(--muted);font-size:12px}
.field{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-bottom:7px}
.field label{color:var(--muted);font-size:12px}
.field input,.field select{width:100%}
.help{color:var(--muted);font-size:12px}
.help kbd,.kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.help table{border-collapse:collapse;width:100%}
.help td{padding:2px 0;vertical-align:top}
/* bottom */
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
#resizer{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:4}
.tabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .grow{flex:1}
.tabbody{display:none;flex:1;min-height:0;padding:8px 10px;gap:10px}
.tabbody.on{display:flex}
.ctrl{display:flex;flex-direction:column;gap:6px;width:230px;flex:none;overflow-y:auto}
.ctrl .row{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:6px}
.ctrl .row label{color:var(--muted);font-size:12px}
.ctrl .btns{display:flex;gap:6px;flex-wrap:wrap}
.plotcol{flex:1;display:flex;flex-direction:column;min-width:0;gap:6px}
canvas.plot{flex:1;width:100%;min-height:0;border:1px solid var(--line);border-radius:6px;display:block}
.readout{display:flex;gap:14px;flex-wrap:wrap;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.readout b{color:var(--text);font-weight:600}
.scroll{overflow:auto;flex:1;min-width:0}
table.data{border-collapse:collapse;font:12px ui-monospace,Menlo,monospace;width:100%}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left;white-space:nowrap}
table.data th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.err{color:var(--err)}
textarea{width:100%;height:100%;resize:none;background:var(--plotbg);color:var(--text);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,Menlo,monospace;padding:8px}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.plots{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 110px;gap:10px;min-height:0}
.plots .plotcol{min-height:0}
#spec{min-width:0}
.ctrl .sect{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);padding-top:6px}
.ctrl .sect:first-child{border-top:0;margin-top:0;padding-top:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
@media (max-width:1150px){ .plots{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} #spec{display:none} }
footer{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
footer .err{color:var(--err)} footer .ok{color:var(--ok)}
#printArea{display:none}
@media (max-width:900px){
  main{grid-template-columns:56px minmax(0,1fr)}
  aside{display:none}
  body.side aside{display:block;position:fixed;right:0;top:0;bottom:0;width:min(300px,86vw);z-index:60;box-shadow:-8px 0 30px rgba(0,0,0,.4);
    padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-right:env(safe-area-inset-right, 0px)}
  body.side #asideClose{display:block;margin:10px 12px 0 auto}
  .ctrl{width:170px}
  #title{width:130px}
}
@media (max-width:700px){
  body{--bottomH:46%}
  header{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 0}
  header>*{flex:none}
  .brand{margin-right:0} .brand span{display:none}
  #title{width:120px;flex:none}
  main{grid-template-columns:52px minmax(0,1fr)}
  .tabbody .plots{order:-1}
  #tab-ana #knobPanel{order:-2;padding:0 0 6px;border-bottom:1px solid var(--line)}
  #tab-ana #knobPanel h3{margin-bottom:4px}
  #tab-ana #knobs{flex-wrap:nowrap;overflow-x:auto}
  #tab-ana .knob{flex:none}
  .pal svg{width:34px;height:26px}
  #modeBadge{right:10px;white-space:normal;font-size:11px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:0}
  .tab{padding:8px 9px}
  .tabbody{padding:8px 0}
  .tabbody.on{flex-direction:column;overflow-y:auto}
  .ctrl{width:auto;flex:none;overflow:visible}
  .ctrl .row{grid-template-columns:120px 1fr}
  .plotcol{flex:none}
  canvas.plot{flex:none;height:210px}
  #spec{display:none}
  .plots{grid-template-columns:minmax(0,1fr);flex:none}
  .scroll{flex:none;overflow-x:auto}
  #tab-net textarea{height:220px}
  footer{padding:0}
}
@media print{
  body{display:block;background:#fff;color:#000;overflow:visible}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea svg{width:100%;height:auto;max-height:65vh}
  #printArea table{border-collapse:collapse;width:100%;font:11px sans-serif;margin-top:12px}
  #printArea td,#printArea th{border:1px solid #999;padding:3px 6px;text-align:left}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect x="5" y="3" width="22" height="26" rx="4" fill="var(--accent)"/><circle cx="11" cy="10" r="3" fill="var(--accent-ink)"/><circle cx="21" cy="10" r="3" fill="var(--accent-ink)"/><rect x="11" y="18" width="10" height="7" rx="2" fill="var(--accent-ink)"/></svg>
    <span>Stompbox Lab</span>
  </div>
  <input id="title" type="text" value="Circuito senza titolo" title="Nome del circuito">
  <button id="bNew" title="Nuovo circuito">Nuovo</button>
  <button id="bOpen" title="Apri un circuito (.json) o importa una netlist SPICE (.cir, .net, .sp)">Apri / Importa…</button>
  <input type="file" id="fOpen" accept=".json,.cir,.net,.sp,.spi,.ckt,.txt,application/json,text/plain" hidden>
  <button id="bSave" title="Salva (Ctrl+S)">Salva</button>
  <select id="selExample" title="Carica un circuito di esempio"><option value="">Esempi…</option></select>
  <div class="dd" id="ddExport"><button id="bExport">Esporta ▾</button>
    <div class="ddm">
      <button data-exp="cir">Netlist SPICE (.cir)</button>
      <button data-exp="bom">Distinta componenti (.csv)</button>
      <button data-exp="svg">Schema (.svg)</button>
      <button data-exp="png" class="needsave">Schema (.png)</button>
      <button data-exp="json">Circuito (.json)</button>
      <button data-exp="wav" class="localonly">Audio processato (.wav)</button>
      <button data-exp="print" class="localonly">Stampa / PDF</button>
      <button data-exp="import">Importa netlist o JSON (incolla)…</button>
    </div>
  </div>
  <span class="sep"></span>
  <button id="bUndo" title="Annulla (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Ripeti (Ctrl+Y)">↷</button>
  <button id="bRot" title="Ruota (Spazio)">⟳</button>
  <button id="bDup" title="Duplica (Ctrl+D)">⧉</button>
  <button id="bDel" title="Elimina (Canc)">✕</button>
  <span class="sep"></span>
  <label class="chk" title="Mostra le tensioni DC sui nodi"><input type="checkbox" id="cShowV"> Tensioni DC</label>
  <button id="bTheme" title="Tema chiaro/scuro">◐</button>
  <button id="bSide" title="Pannello laterale">☰</button>
</header>

<main>
  <nav id="palette"></nav>
  <section id="canvasWrap">
    <svg id="sch" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridPat" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="0" cy="0" r="1.1" fill="var(--grid)"/><circle cx="20" cy="0" r="1.1" fill="var(--grid)"/>
          <circle cx="0" cy="20" r="1.1" fill="var(--grid)"/><circle cx="20" cy="20" r="1.1" fill="var(--grid)"/>
        </pattern>
      </defs>
      <rect id="gridRect" x="-20000" y="-20000" width="40000" height="40000" fill="url(#gridPat)"/>
      <g id="gWires"></g><g id="gComps"></g><g id="gOver"></g>
    </svg>
    <div id="modeBadge"></div>
    <div id="tip"></div>
    <div id="zoomBtns"><button id="bZin" title="Zoom +">＋</button><button id="bZout" title="Zoom −">－</button><button id="bFit" title="Adatta alla vista">⤢</button></div>
  </section>
  <aside>
    <button id="asideClose" title="Chiudi pannello">✕ Chiudi</button>
    <div class="panel" id="knobPanel"><h3>Controlli (potenziometri e deviatori)</h3><div id="knobs"></div></div>
    <div class="panel"><h3 id="propTitle">Proprietà</h3><div id="props"></div></div>
  </aside>
</main>

<section id="bottom">
  <div id="resizer"></div>
  <div class="tabs">
    <button class="tab on" data-tab="ana">Risposta e forma d'onda</button>
    <button class="tab" data-tab="dc">Punto di lavoro DC</button>
    <button class="tab" data-tab="audio">Ascolto audio</button>
    <button class="tab" data-tab="net">Netlist e distinta</button>
    <span class="grow"></span>
    <label class="chk" title="Ricalcola automaticamente a ogni modifica"><input type="checkbox" id="cAuto" checked> Auto</label>
    <button class="primary" id="bRun" title="Esegui l'analisi (F5)">▶ Simula</button>
  </div>

  <div class="tabbody on" id="tab-ana">
    <div class="ctrl">
      <div class="sect">Risposta in frequenza</div>
      <div class="row"><label>Banda</label><span class="pair"><input type="text" id="fMin" value="20" aria-label="Frequenza minima"><input type="text" id="fMax" value="20k" aria-label="Frequenza massima"></span></div>
      <div class="row"><label>Punti</label><input type="number" id="fPts" value="160" min="10" max="1000"></div>
      <div class="row"><label>Sweep pot.</label><select id="fSweep"><option value="">— nessuno —</option></select></div>
      <label class="chk"><input type="checkbox" id="fPhase"> Mostra fase</label>
      <div class="btns"><button id="fRef" title="Congela la curva attuale come riferimento">Fissa riferimento</button><button id="fRefClr">Togli</button></div>
      <div class="sect">Forma d'onda</div>
      <div class="row"><label>Frequenza</label><input type="text" id="sFreq" value="440"></div>
      <div class="row"><label>Ampiezza (V pk)</label><input type="text" id="sAmp" value="0.3"></div>
      <div class="row"><label>Forma</label><select id="sWave"><option value="sine">Sinusoide</option><option value="tri">Triangolare</option><option value="square">Quadra</option></select></div>
      <div class="row"><label>Periodi</label><input type="number" id="sPer" value="3" min="1" max="20"></div>
      <div class="row"><label>Assestamento</label><select id="sSettle"><option value="50">50 ms</option><option value="200" selected>200 ms</option><option value="500">500 ms</option><option value="1000">1 s</option></select></div>
      <label class="chk"><input type="checkbox" id="sShowIn" checked> Mostra ingresso</label>
    </div>
    <div class="plots">
      <div class="plotcol"><canvas class="plot" id="cvFreq"></canvas><div class="readout" id="roFreq"></div></div>
      <div class="plotcol"><canvas class="plot" id="cvScope"></canvas><div class="readout" id="roScope"></div></div>
      <div class="plotcol" id="spec"><canvas class="plot" id="cvSpec"></canvas><div class="readout">Armoniche (dB)</div></div>
    </div>
  </div>

  <div class="tabbody" id="tab-dc">
    <div class="scroll"><table class="data" id="tblNodes"></table></div>
    <div class="scroll"><table class="data" id="tblDev"></table></div>
  </div>

  <div class="tabbody" id="tab-audio">
    <div class="ctrl">
      <div class="row"><label>Sorgente</label><select id="aSrc">
        <option value="riff">Riff chitarra</option><option value="chord">Accordo aperto</option>
        <option value="note">Nota singola</option><option value="bass">Note basse</option>
        <option value="sine">Sinusoide 220 Hz</option><option value="file">File audio…</option></select></div>
      <input type="file" id="aFile" accept="audio/*" hidden>
      <div class="row"><label>Livello in.</label><input type="range" id="aLvl" min="0.02" max="2" step="0.01" value="0.35"></div>
      <div class="row"><label></label><span class="help" id="aLvlTxt"></span></div>
      <div class="row"><label>Volume</label><input type="range" id="aVol" min="0" max="1" step="0.01" value="0.6"></div>

  if (!sets.c.size && !sets.w.size) return;

  if (sets.c.size === 1 && !sets.w.size) { const c = findComp([...sets.c][0]); c.rot = (c.rot + 1) % 4; changed(); return; }
  // rotazione di gruppo di 90° attorno al centro
  const comps = circ.comps.filter(c => sets.c.has(c.id)), wires = circ.wires.filter(w => sets.w.has(w.id));
  const pts = [...comps, ...wires.flatMap(w => [w.a, w.b])];
  const cx = Math.round(pts.reduce((s, p) => s + p.x, 0) / pts.length), cy = Math.round(pts.reduce((s, p) => s + p.y, 0) / pts.length);
  const rp = p => { const x = p.x - cx, y = p.y - cy; p.x = cx - y; p.y = cy + x; };
  for (const c of comps) { rp(c); c.rot = (c.rot + 1) % 4; }
  for (const w of wires) { rp(w.a); rp(w.b); }
  changed();
}
function deleteSel(){
  const sets = selSets();
  if (!sets.c.size && !sets.w.size) return;
  pushUndo();
  circ.comps = circ.comps.filter(c => !sets.c.has(c.id));
  circ.wires = circ.wires.filter(w => !sets.w.has(w.id));
  setSelection([], []); changed();
}
function copySel(){
  const sets = selSets();
  if (!sets.c.size && !sets.w.size) return false;
  st.clip = JSON.stringify({comps:circ.comps.filter(c => sets.c.has(c.id)), wires:circ.wires.filter(w => sets.w.has(w.id))});
  st.pasteN = 0;
  status(`Copiati ${sets.c.size} componenti e ${sets.w.size} fili.`, 'ok');
  return true;
}
function pasteClip(){
  if (!st.clip) return;
  const d = JSON.parse(st.clip), off = 2 * (++st.pasteN);
  pushUndo();
  const ids = [[], []];
  for (const c of d.comps) {
    c.id = newId('c'); c.x += off; c.y += off;
    const oldRef = c.ref; c.ref = nextRef(c.type);
    if (c.type === 'PROBE' && c.props.label === oldRef) c.props.label = c.ref;
    circ.comps.push(c); ids[0].push(c.id);
  }
  for (const w of d.wires) { w.id = newId('w'); for (const p of [w.a, w.b]) { p.x += off; p.y += off; } circ.wires.push(w); ids[1].push(w.id); }
  setSelection(ids[0], ids[1]); changed();
}
function duplicateSel(){ if (copySel()) pasteClip(); }
function selectAll(){ setTool('select'); setSelection(circ.comps.map(c => c.id), circ.wires.map(w => w.id)); render(); renderProps(); }
function nudgeSel(dx, dy){
  const sets = selSets();
  if (!sets.c.size && !sets.w.size) return;
  pushUndo(); applyDrag(groupDrag(sets, {x:0, y:0}), dx, dy); changed();
}
function toggleSwitch(c){
  pushUndo();
  const s = swState(c);
  c.props.state = c.props.mode === 'spst' ? (s === 'off' ? 'a' : 'off') : (s === 'a' ? 'b' : s === 'b' ? 'off' : 'a');
  changed({keepProps:st.sel?.id !== c.id, live:true});
}
let simTimer = 0, liveQueued = false;
function changed(opts = {}){
  render(); if (!opts.keepProps) renderProps(); renderKnobs();
  try { localStorage.setItem('stompboxlab.v1', JSON.stringify({title:$('#title').value, circ})); } catch (e) {}
  clearTimeout(simTimer);
  if (opts.live) { // aggiornamento in tempo reale: al massimo una simulazione per fotogramma
    if (!liveQueued) { liveQueued = true; requestAnimationFrame(() => { liveQueued = false; runAll(false); }); }
  } else simTimer = setTimeout(() => runAll(false), 200);
  audioCircuitChanged();
}

function fillSweep(pots){
  const sel = $('#fSweep'), cur = sel.value;
  const html = '<option value="">— nessuno —</option>' + pots.map(p => `<option value="${p.id}">${esc(p.props.label || p.ref)} (${esc(p.ref)})</option>`).join('');

function arc(a0, a1, r = 23){
  const pt = a => [28 + r * Math.sin(a), 28 - r * Math.cos(a)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
}
function updateKnob(el, p){
  if (!el) return;
  const A = 2.35, v = clamp(+p.props.pos, 0, 1), a = -A + 2 * A * v;
  el.querySelector('.ktrack').setAttribute('d', arc(-A, A));
  el.querySelector('.kval').setAttribute('d', v > 0.005 ? arc(-A, a) : '');
  el.querySelector('.kptr').setAttribute('transform', `rotate(${a * 180 / Math.PI} 28 28)`);
  el.querySelector('.kl').textContent = p.props.label || p.ref;
  el.querySelector('.kl').title = `${p.ref} · ${valueText(p)}`;
  el.querySelector('.kv').textContent = (v * 10).toFixed(1) + ' / 10';
  el.querySelector('svg').setAttribute('aria-valuenow', (v * 10).toFixed(1));
  el.querySelector('svg').setAttribute('aria-label', p.props.label || p.ref);
}
function bindKnob(el){
  const sv = el.querySelector('svg');
  const get = () => findComp(el.dataset.kid);
  const set = (v, live = true) => {
    const p = get(); if (!p) return;
    p.props.pos = +clamp(v, 0, 1).toFixed(3); updateKnob(el, p);
    changed({keepProps:true, live});
    if (st.sel?.id === p.id) { const r = $('#props [data-k=pos]'); if (r) r.value = p.props.pos; }
  };
  sv.addEventListener('pointerdown', e => {
    e.preventDefault(); sv.setPointerCapture(e.pointerId); pushUndo(); st.sticky = true;
    const y0 = e.clientY, x0 = e.clientX, v0 = +get().props.pos;
    const mv = ev => set(v0 + ((y0 - ev.clientY) + (ev.clientX - x0) * 0.5) / (ev.shiftKey ? 600 : 160));
    const up = () => { sv.removeEventListener('pointermove', mv); sv.removeEventListener('pointerup', up); sv.removeEventListener('pointercancel', up); st.sticky = false; changed({keepProps:true}); };
    sv.addEventListener('pointermove', mv); sv.addEventListener('pointerup', up); sv.addEventListener('pointercancel', up);
  });
  sv.addEventListener('wheel', e => { e.preventDefault(); set(+get().props.pos + (e.deltaY < 0 ? 0.02 : -0.02)); }, {passive:false});
  sv.addEventListener('keydown', e => {
    const d = {ArrowUp:0.02, ArrowRight:0.02, ArrowDown:-0.02, ArrowLeft:-0.02, PageUp:0.1, PageDown:-0.1}[e.key];
    if (d) { e.preventDefault(); e.stopPropagation(); pushUndo(); set(+get().props.pos + d); }
  });
  sv.addEventListener('dblclick', () => { pushUndo(); set(0.5); });
}

/* =========================================================================
   ANALISI
   ========================================================================= */
function status(msg, cls = ''){ const s = $('#stMsg'); s.textContent = msg; s.className = cls; }
function prepare(){
  st.net = null; st.dc = null; st.err = null;
  const net = compile(circ);
  const sim = new Sim(net);
  const ok = sim.dcop();
  st.net = net; st.dc = Array.from(sim.x.slice(0, net.n));
  st.dcSim = sim;
  if (!ok) throw new Error('Il punto di lavoro DC non converge: controlla nodi flottanti, sorgenti in cortocircuito o valori estremi.');
  return {net, sim};
}
function activeTab(){ return $('.tab.on').dataset.tab; }
function runAll(forced){
  const t0 = performance.now();
  let ctx = null, errMsg = null;
  try { ctx = prepare(); }
  catch (err) { errMsg = err.message; st.err = err.message; }
  renderDC(); renderNetTab();
  const tab = activeTab();
  if (ctx && (forced || $('#cAuto').checked) && tab === 'ana') {
    try { runFreq(ctx); } catch (err) { errMsg = err.message; $('#roFreq').innerHTML = `<span class="tag err">${esc(err.message)}</span>`; }
    // durante la regolazione dal vivo la risposta si aggiorna a ogni fotogramma, la forma d'onda ogni ~120 ms
    if (!st.sticky || performance.now() - (st.lastScopeT || 0) > 120) {
      try { runScope(ctx); st.lastScopeT = performance.now(); } catch (err) { errMsg = errMsg || err.message; $('#roScope').innerHTML = `<span class="tag err">${esc(err.message)}</span>`; }
    }
  }
  if (ctx && forced && tab === 'audio') audioPlay();
  if (errMsg) status('⚠ ' + errMsg, 'err');
  else status(`Simulazione completata in ${(performance.now() - t0).toFixed(0)} ms.`, 'ok');
  renderOverlay();
  if (st.sel?.kind === 'comp') { const old = $('#props p.dcinfo'); if (old) old.outerHTML = devInfo(findComp(st.sel.id)) || ''; }
  $('#stInfo').textContent = st.net ? `${st.net.n - st.net.internal.size} nodi · ${circ.comps.length} componenti` : '';
}
function outputs(net){
  const tr = [];
  if (net.out) tr.push({name:'Uscita', node:net.out, color:'--t2'});
  for (const p of net.probes) tr.push({name:p.name, node:p.node, color:p.color});
  return tr;
}
function wave(kind, ph){ // ph in cicli
  const f = ph - Math.floor(ph);
  if (kind === 'tri') return f < 0.25 ? 4 * f : f < 0.75 ? 2 - 4 * f : 4 * f - 4;
  if (kind === 'square') return f < 0.5 ? 1 : -1;
  return Math.sin(2 * Math.PI * f);
}
function runScope(ctx){
  const {net, sim} = ctx || prepare();
  const f = parseVal($('#sFreq').value), amp = parseVal($('#sAmp').value);
  if (!(f > 0) || !(amp >= 0)) throw new Error('Frequenza o ampiezza del segnale non valida.');
  if (!net.ins.length) throw new Error("Aggiungi un ingresso (IN) per vedere la forma d'onda.");
  const N = st.sticky ? 128 : 256, h = 1 / (f * N), per = clamp(+$('#sPer').value || 3, 1, 20);
  let settle = Math.ceil(+$('#sSettle').value / 1000 * f) * N;
  settle = Math.min(settle, (st.sticky ? 40 : 200) * N, 240000 - (240000 % N));
  const kind = $('#sWave').value, traces = outputs(net);
  sim.initTran(h);
  for (let i = 0; i < settle; i++) sim.step(amp * wave(kind, i / N));
  const M = per * N, t = new Array(M), vin = new Array(M), ys = traces.map(() => new Array(M));
  for (let i = 0; i < M; i++) {
    const v = amp * wave(kind, (settle + i) / N);
    sim.step(v);
    t[i] = i * h * 1000; vin[i] = v;
    traces.forEach((tr, k) => ys[k][i] = sim.V(tr.node));
  }
  const series = [];
  if ($('#sShowIn').checked) series.push({name:'Ingresso', color:'--t1', y:vin});
  traces.forEach((tr, k) => series.push({name:tr.name, color:tr.color, y:ys[k]}));

    if (!d) return;
    g.fillStyle = cssv(col);
    const step = d.length / W;
    for (let x = 0; x < W; x++) {
      let mn = 1, mx = -1;
      const a = Math.floor(x * step), b = Math.min(d.length, Math.floor((x + 1) * step));
      for (let i = a; i < b; i++) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }

function encodeWav(data){
  const buf = new ArrayBuffer(44 + data.length * 2), v = new DataView(buf);
  const ws = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, SR, true);
  v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, data.length * 2, true);
  for (let i = 0; i < data.length; i++) v.setInt16(44 + i * 2, clamp(data[i], -1, 1) * 32767, true);
  return new Blob([buf], {type:'audio/wav'});
}

const safe = s => String(s).replace(/[^A-Za-z0-9_]/g, '_');

function oaSubckt(m, vp, vn){

  const cx = 1 / (2 * Math.PI * m.gbw), imax = Math.max(m.sr * 1e6 * cx, 1e-6), L = (vp - vn) / 2 - m.head;
  return [name, `.subckt ${name} inp inn out

B1 0 x I=${fmtP(imax)}*tanh((V(inp)-V(inn))/${fmtP(imax)})
Rx x 0 ${m.gain}
Cx x 0 ${fmtP(cx)}
B2 out 0 V=${fmtP((vp + vn) / 2)}+${fmtP(L)}*tanh(V(x)/${fmtP(L)})
.ends ${name}`];

function bomRows(){
  const groups = new Map();
  for (const c of circ.comps) {
    if (['GND', 'VCC', 'PROBE', 'NET'].includes(c.type)) continue;
    let desc = TYPES[c.type].name, val = valueText(c);

    if (c.type === 'POT') val = `${fmtEng(parseVal(c.props.value), 'Ω')} ${({lin:'B', log:'A', rlog:'C'})[c.props.taper]}`;
    if (c.type === 'SW') { desc = c.props.mode === 'spst' ? 'Interruttore SPST' : 'Deviatore SPDT on-off-on'; val = c.props.label || '—'; }
    if (c.type === 'IN' || c.type === 'OUT') { desc = 'Jack 6,35 mm mono'; val = c.type === 'IN' ? 'Ingresso' : 'Uscita'; }

  if (t.startsWith('{')) { importJSON(t); return; }

    a.add('IN', 2, 8); a.add('C', 6, 8, 0, {value:'22n'}); a.add('R', 8, 10, 1, {value:'1M'}); a.add('VCC', 8, 12, 2, {value:4.5, label:'Vref'});
    a.w(8, 8, 12, 8); a.add('OPAMP', 14, 9, 0, {model:'TL072'});
    a.w(12, 10, 12, 12, 13, 12); a.add('R', 12, 14, 1, {value:'1k'}); a.add('C', 12, 18, 1, {value:'4.7u', polar:true}); a.add('GND', 12, 20);
    a.add('POT', 15, 12, 0, {value:'1M', taper:'log', label:'Gain', pos:0.6}); a.w(15, 14, 17, 14);
    a.w(13, 12, 13, 16); a.add('C', 15, 16, 0, {value:'100p'}); a.w(17, 12, 17, 14, 17, 16);
    a.w(17, 12, 17, 9); a.w(17, 9, 19, 9); a.add('C', 21, 9, 0, {value:'1u'}); a.add('R', 25, 9, 0, {value:'1k'});
    a.w(27, 9, 27, 11); a.add('SW', 29, 11, 0, {mode:'spdt', state:'a', label:'Clipping'});
    a.w(31, 10, 34, 10, 36, 10); a.add('D', 34, 12, 1, {model:'1N4148'}); a.add('D', 36, 12, 3, {model:'1N4148'}); a.add('GND', 34, 14); a.add('GND', 36, 14);
    a.w(31, 12, 31, 18, 34, 18, 36, 18); a.add('LED', 34, 20, 1, {model:'LED rosso'}); a.add('LED', 36, 20, 3, {model:'LED rosso'}); a.add('GND', 34, 22); a.add('GND', 36, 22);
    a.w(27, 9, 40, 9); a.add('C', 42, 9, 0, {value:'1u'}); a.w(44, 9, 46, 9);
    a.add('POT', 46, 11, 3, {value:'100k', taper:'log', label:'Level', pos:0.7}); a.add('GND', 46, 13);
    a.add('OUT', 52, 11); a.w(48, 11, 50, 11);
  }],
  fuzz: ['Fuzz a due transistor (silicio)', a => {
    a.add('IN', 2, 12); a.add('C', 6, 12, 0, {value:'2.2u', polar:true}); a.add('NPN', 10, 12, 0, {model:'BC108'}); a.add('GND', 11, 14);
    a.add('R', 11, 6, 1, {value:'33k'}); a.add('VCC', 11, 4); a.w(11, 8, 11, 10);
    a.add('NPN', 16, 10, 0, {model:'BC108'}); a.w(11, 10, 14, 10);
    a.add('R', 17, 2, 1, {value:'8.2k'}); a.add('VCC', 17, 0); a.add('R', 17, 6, 1, {value:'470'});
    a.w(17, 4, 20, 4); a.add('C', 22, 4, 0, {value:'10n'}); a.w(24, 4, 26, 4);
    a.add('POT', 26, 6, 3, {value:'500k', taper:'log', label:'Volume', pos:0.6}); a.add('GND', 26, 8); a.add('OUT', 32, 6); a.w(28, 6, 30, 6);
    a.add('POT', 17, 14, 3, {value:'1k', taper:'lin', label:'Fuzz', pos:0.85}); a.add('GND', 17, 16);
    a.add('C', 19, 16, 1, {value:'22u', polar:true}); a.add('GND', 19, 18);
    a.w(8, 12, 8, 20, 10, 20); a.add('R', 12, 20, 0, {value:'100k'}); a.w(14, 20, 23, 20, 23, 12, 17, 12);
  }],
  jfet: ['Booster a JFET', a => {
    a.add('IN', 2, 10); a.add('C', 6, 10, 0, {value:'100n'}); a.add('JFET', 10, 10, 0, {model:'J201'});
    a.add('R', 8, 14, 1, {value:'1M'}); a.w(8, 10, 8, 12); a.add('GND', 8, 16);
    a.add('R', 11, 6, 1, {value:'10k'}); a.add('VCC', 11, 4);
    a.add('R', 11, 14, 1, {value:'1k'}); a.add('GND', 11, 16);
    a.w(11, 12, 14, 12); a.add('C', 14, 14, 1, {value:'22u', polar:true}); a.add('GND', 14, 16);
    a.w(11, 8, 14, 8); a.add('C', 16, 8, 0, {value:'1u'}); a.w(18, 8, 20, 8);
    a.add('POT', 20, 10, 3, {value:'100k', taper:'log', label:'Volume', pos:0.7}); a.add('GND', 20, 12);
    a.add('OUT', 26, 10); a.w(22, 10, 24, 10);
  }],
  lowpass: ['Filtro passa-basso RC', a => {
    a.add('IN', 2, 6); a.add('R', 6, 6, 0, {value:'10k'}); a.add('C', 8, 8, 1, {value:'10n'}); a.add('GND', 8, 10);
    a.w(8, 6, 12, 6); a.add('OUT', 14, 6);

/* =========================================================================
   AVVIO E COLLEGAMENTI UI
   ========================================================================= */
function initUI(){
  buildPalette();
  const sel = $('#selExample');
  for (const k in EXAMPLES) sel.insertAdjacentHTML('beforeend', `<option value="${k}">${EXAMPLES[k][0]}</option>`);
  sel.addEventListener('change', () => { if (!sel.value) return; const [name, fn] = EXAMPLES[sel.value]; loadCircuit(buildExample(fn), name); sel.value = ''; });
  let newArm = 0;
  $('#bNew').onclick = () => {
    if (circ.comps.length && !newArm) { $('#bNew').textContent = 'Confermi?'; $('#bNew').classList.add('on'); newArm = setTimeout(() => { newArm = 0; $('#bNew').textContent = 'Nuovo'; $('#bNew').classList.remove('on'); }, 3000); return; }
    clearTimeout(newArm); newArm = 0; $('#bNew').textContent = 'Nuovo'; $('#bNew').classList.remove('on');
    loadCircuit({comps:[], wires:[]}, 'Circuito senza titolo');
  };
  if (EMBED) { $$('.localonly').forEach(b => b.hidden = true); if (!dlNS) $$('.needsave').forEach(b => b.hidden = true); }
  $('#mClose').onclick = () => $('#modal').hidden = true;
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
  $('#asideClose').onclick = () => document.body.classList.remove('side');
  // su schermi stretti le manopole stanno sopra i grafici, per regolarle guardando la risposta
  const mq = matchMedia('(max-width:700px)'), kp = $('#knobPanel'), home = kp.parentNode, homeNext = kp.nextElementSibling;
  const placeKnobs = () => { if (mq.matches) $('#tab-ana').prepend(kp); else home.insertBefore(kp, homeNext); };
  placeKnobs(); mq.addEventListener('change', placeKnobs);
  $('#bOpen').onclick = () => $('#fOpen').click();
  $('#fOpen').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { importAny(await f.text(), f.name.replace(/\.\w+$/, '')); }
    catch (err) { status('⚠ Import non riuscito: ' + err.message, 'err'); showModal({title:'Import non riuscito', hint:err.message, text:''}); }
    e.target.value = '';
  };
  $('#bSave').onclick = saveFile;
  const wrap = $('#canvasWrap');
  wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('drop'); });
  wrap.addEventListener('dragleave', () => wrap.classList.remove('drop'));
  wrap.addEventListener('drop', async e => {
    e.preventDefault(); wrap.classList.remove('drop');
    const f = e.dataTransfer.files[0]; if (!f) return;
    try { importAny(await f.text(), f.name.replace(/\.\w+$/, '')); }
    catch (err) { status('⚠ Import non riuscito: ' + err.message, 'err'); }
  });
  $('#fRef').onclick = () => { if (st.lastFreq) { st.freqRef = {key:st.lastFreq.key, y:st.lastFreq.db.slice()}; runAll(true); status('Curva di riferimento fissata: modifica il circuito per confrontare.', 'ok'); } };
  $('#fRefClr').onclick = () => { st.freqRef = null; runAll(true); };
  $('#fSweep').addEventListener('change', () => runAll(true));
  $('#bExport').onclick = e => { e.stopPropagation(); $('#ddExport').classList.toggle('open'); };
  document.addEventListener('click', () => $('#ddExport').classList.remove('open'));
  $$('[data-exp]').forEach(b => b.onclick = () => doExport(b.dataset.exp));
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bRot').onclick = rotateSel; $('#bDel').onclick = deleteSel; $('#bDup').onclick = duplicateSel;
  $('#bZin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); };
  $('#bZout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8); };
  $('#bFit').onclick = fit;
  $('#cShowV').onchange = renderOverlay;
  $('#bTheme').onclick = () => {
    const eff = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const cur = eff === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = cur;
    try { localStorage.setItem('stompboxlab.theme', cur); } catch (e) {}
    redrawPlots();
  };
  $('#bSide').onclick = () => document.body.classList.toggle('side');
  $('#title').addEventListener('change', () => changed({keepProps:true}));
  $$('.tab').forEach(t => t.onclick = () => {
    $$('.tab').forEach(x => x.classList.toggle('on', x === t));
    $$('.tabbody').forEach(b => b.classList.toggle('on', b.id === 'tab-' + t.dataset.tab));
    requestAnimationFrame(() => { redrawPlots(); if ($('#cAuto').checked && t.dataset.tab === 'ana') runAll(false); });
  });
  $('#bRun').onclick = () => runAll(true);
  ['#sFreq', '#sAmp', '#sPer', '#sSettle', '#sWave', '#sShowIn', '#fMin', '#fMax', '#fPts', '#fPhase'].forEach(s => $(s).addEventListener('change', () => runAll(true)));
  // audio
  const lvlTxt = () => $('#aLvlTxt').textContent = `${(+$('#aLvl').value).toFixed(2)} V di picco (pickup ${+$('#aLvl').value < 0.2 ? 'single-coil leggero' : +$('#aLvl').value < 0.6 ? 'humbucker' : 'molto caldo / booster'})`;
  lvlTxt();
  $('#aLvl').addEventListener('input', lvlTxt);
  $('#aLvl').addEventListener('change', () => audioCircuitChanged());
  $('#aVol').addEventListener('input', () => { if (au.master) au.master.gain.value = +$('#aVol').value; });
  $('#aNorm').addEventListener('change', () => audioCircuitChanged());
  $('#aOS').addEventListener('change', () => audioCircuitChanged());
  $('#aLoop').addEventListener('change', () => au.src.forEach(s => s.loop = $('#aLoop').checked));
  $('#aSrc').addEventListener('change', () => { if ($('#aSrc').value === 'file' && !au.fileBuf) $('#aFile').click(); else audioCircuitChanged(); });
  $('#aFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      ensureCtx();
      const ab = await au.ctx.decodeAudioData(await f.arrayBuffer());
      const len = Math.min(ab.length, ab.sampleRate * 12);
      const off = new OfflineAudioContext(1, Math.ceil(len / ab.sampleRate * SR), SR);
      const s = off.createBufferSource(); s.buffer = ab; s.connect(off.destination); s.start();
      const r = await off.startRendering();
      au.fileBuf = r.getChannelData(0).slice();
      status(`File audio caricato (${(au.fileBuf.length / SR).toFixed(1)} s).`, 'ok');
      audioPlay();
    } catch (err) { status('⚠ Impossibile leggere il file audio: ' + err.message, 'err'); }
    e.target.value = '';
  });
  $('#aPlay').onclick = () => audioPlay(false);
  $('#aStop').onclick = audioStop;
  $('#aBypass').onclick = () => { au.bypass = !au.bypass; applyBypass(); };
  $('#bCopyNet').onclick = async () => { try { await navigator.clipboard.writeText($('#txtNet').value); status('Netlist copiata negli appunti.', 'ok'); } catch (e) { $('#txtNet').select(); document.execCommand('copy'); } };
  // ridimensionamento pannello inferiore
  $('#resizer').addEventListener('pointerdown', e => {
    const r = $('#resizer'); r.setPointerCapture(e.pointerId);
    const y0 = e.clientY, h0 = $('#bottom').getBoundingClientRect().height;
    const mv = ev => { document.body.style.setProperty('--bottomH', clamp(h0 + y0 - ev.clientY, 140, window.innerHeight - 200) + 'px'); updateView(); };
    const up = () => { r.removeEventListener('pointermove', mv); r.removeEventListener('pointerup', up); redrawPlots(); };
    r.addEventListener('pointermove', mv); r.addEventListener('pointerup', up);
  });
  window.addEventListener('resize', () => { updateView(); redrawPlots(); });
  // tastiera
  window.addEventListener('keydown', e => {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag) && e.key !== 'Escape') return;
    const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
    if (ctrl && k === 's') { e.preventDefault(); saveFile(); return; }
    if (ctrl && k === 'd') { e.preventDefault(); duplicateSel(); return; }
    if (ctrl && k === 'c') { if (copySel()) e.preventDefault(); return; }
    if (ctrl && k === 'x') { if (copySel()) { e.preventDefault(); deleteSel(); } return; }
    if (ctrl && k === 'v') { e.preventDefault(); pasteClip(); return; }
    if (ctrl && k === 'a') { e.preventDefault(); selectAll(); return; }
    if (ctrl) return;
    if (e.key === 'F5') { e.preventDefault(); runAll(true); return; }
    if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal').hidden = true; return; }
    if (e.key === 'Escape') { document.activeElement?.blur?.(); if (st.tool === 'wire' && st.wireStart) finishWire(); else setTool('select'); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
    if (e.key === ' ') { e.preventDefault(); rotateSel(); return; }
    const arrow = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key];
    if (arrow && st.tool === 'select') { e.preventDefault(); nudgeSel(...arrow); return; }
    if (k === 'w') { setTool('wire'); return; }
    for (const t in TYPES) if (TYPES[t].key === k) { st.rot = 0; setTool(t); return; }
  });
}

initUI();
(function boot(){
  try { const th = localStorage.getItem('stompboxlab.theme'); if (th && !EMBED) document.documentElement.dataset.theme = th; } catch (e) {}
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('stompboxlab.v1') || 'null'); } catch (e) {}
  if (saved && saved.circ && saved.circ.comps.length) { circ = saved.circ; $('#title').value = saved.title || 'Circuito'; }
  else { circ = buildExample(EXAMPLES.overdrive[1]); $('#title').value = EXAMPLES.overdrive[0]; }
  render(); renderProps(); renderKnobs();
  requestAnimationFrame(() => { fit(); runAll(true); });
})();
</script>
</body>
</html>
